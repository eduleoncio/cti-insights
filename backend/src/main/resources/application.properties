spring.application.name=cti-insights

# Azure Database for PostgreSQL
spring.datasource.url=jdbc:postgresql://eduardo.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=Eduardo
spring.datasource.password=${AZURE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
